name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: belajar_data_test
          MYSQL_USER: belajar_data
          MYSQL_PASSWORD: belajar_data_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure application
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: belajar_data_test
          DB_USERNAME: belajar_data
          DB_PASSWORD: belajar_data_password

      - name: Migrate test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: belajar_data_test
          DB_USERNAME: belajar_data
          DB_PASSWORD: belajar_data_password

      - name: Validate repository content
        run: php artisan content:validate --no-ansi

      - name: Run backend tests
        run: php artisan test --no-ansi
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: belajar_data_test
          DB_USERNAME: belajar_data
          DB_PASSWORD: belajar_data_password

      - name: Run frontend tests
        run: node --test tests/Frontend/*.test.js

      - name: Build production assets
        run: npm run build
